<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ailen AI | Creación de contenido con IA</title>
    <meta name="description"
        content="Ailen AI - Academia Digital Aceleradora de Inteligencia Artificial. Enlaces oficiales y recursos.">
    <style>
        :root {
            --color-bg: #F8F5ED;
            --color-bg-alt: #F3EFE6;
            --color-surface: #FAF8F2;
            --color-surface-alt: #E8E1D4;
            --color-text: #191919;
            --color-text-muted: #6F6B64;
            --color-border: rgba(25, 25, 25, 0.70);
            --color-border-soft: rgba(25, 25, 25, 0.15);

            --font-sans: 'Montserrat', sans-serif;
            --font-serif: 'Playfair Display', serif;

            --radius-card: 22px;
            --radius-pill: 999px;

            --shadow-soft: 0 5px 18px rgba(0, 0, 0, 0.025);
            --shadow-hover: 0 12px 28px rgba(0, 0, 0, 0.07);

            --ease-premium: cubic-bezier(.22, 1, .36, 1);
            --transition: all 250ms var(--ease-premium);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, var(--color-bg) 0%, var(--color-bg-alt) 100%);
            color: var(--color-text);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1 {
            font-family: var(--font-sans);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        a {
            cursor: pointer;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--color-text);
            outline-offset: 4px;
        }

        /* Preloader */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #preloader::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--color-border-soft);
        }

        .loader-content {
            text-align: center;
        }

        .logo-animation {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 500;
            font-size: 2.4rem;
            margin-bottom: 2rem;
            letter-spacing: -0.01em;
            color: var(--color-text);
        }

        .ai-text {
            font-family: var(--font-sans);
            font-style: normal;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            display: inline-block;
            vertical-align: middle;
            margin-left: 0.4rem;
        }

        .progress-bar {
            width: 180px;
            height: 3px;
            background: var(--color-surface-alt);
            margin: 0 auto;
            border-radius: var(--radius-pill);
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--color-text);
        }

        .status-text {
            margin-top: 1.2rem;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            font-weight: 600;
        }

        /* Cover Banner */
        .cover-banner {
            position: relative;
            width: 100%;
            height: 280px;
            background-image: url('https://assets.cdn.filesafe.space/nAQdE71xqcn0C0zJjtPc/media/6a3aaca0967e20d627b9b0d4.png');
            background-size: cover;
            background-position: center;
        }

        .cover-banner::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 90px;
            background: linear-gradient(to bottom, rgba(248, 245, 237, 0), var(--color-bg));
        }

        .linkhub-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 4rem 0;
        }

        .linkhub-grid {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 900px) {
            .linkhub-grid {
                max-width: 1100px;
                padding: 0 2rem;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 5rem;
                align-items: flex-start;
            }
        }

        .page-footer {
            width: 100%;
            padding: 0 1.5rem;
        }

        .profile-side {
            text-align: center;
            margin-top: -110px;
            position: relative;
            z-index: 10;
        }

        .image-wrapper {
            position: relative;
            width: 190px;
            height: 190px;
            margin: 0 auto 42px;
        }

        @media (min-width: 900px) {
            .image-wrapper {
                width: 230px;
                height: 230px;
                margin: 0 auto 48px;
            }

            .profile-side {
                margin-top: -130px;
            }
        }

        .image-wrapper::before {
            content: "";
            position: absolute;
            inset: -8px;
            border: 1px solid var(--color-border-soft);
            border-radius: 50%;
        }

        .avatar-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130%;
            height: 130%;
            background: radial-gradient(circle, rgba(232, 225, 212, 0.55) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid rgba(25, 25, 25, 0.75);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 2;
            background: var(--color-surface);
            transition: transform 500ms var(--ease-premium);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .kicker {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin-bottom: 0.6rem;
        }

        .username {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 400;
            font-size: clamp(36px, 8vw, 52px);
            letter-spacing: -0.01em;
            color: var(--color-text);
            white-space: nowrap;
        }

        .divider {
            width: 70px;
            height: 1px;
            background: var(--color-text);
            opacity: 0.35;
            margin: 28px auto 0;
        }

        .links-side {
            display: flex;
            flex-direction: column;
            gap: 60px;
            position: relative;
            z-index: 10;
            margin-top: 60px;
        }

        @media (min-width: 900px) {
            .links-side {
                margin-top: 3rem;
            }
        }

        .social-icons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 28px;
        }

        .social-icon {
            width: 54px;
            height: 54px;
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text);
            font-size: 1.15rem;
            text-decoration: none;
            border: 1px solid var(--color-text);
            transition: var(--transition);
        }

        .social-icon:hover {
            background: var(--color-text);
            color: var(--color-bg);
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .social-icon:active {
            transform: translateY(-1px) scale(0.97);
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-card {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.25);
            padding: 1.7rem 1.9rem;
            min-height: 96px;
            border-radius: var(--radius-card);
            text-decoration: none;
            color: var(--color-text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-soft);
            transition: transform 300ms var(--ease-premium), background 300ms var(--ease-premium), box-shadow 300ms var(--ease-premium), border-color 300ms var(--ease-premium);
        }

        .link-card::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            height: 1px;
            width: 0%;
            background: rgba(25, 25, 25, 0.35);
            transition: width 350ms var(--ease-premium);
        }

        .link-card * {
            pointer-events: none;
        }

        .link-card:hover {
            background: var(--color-surface);
            border-color: var(--color-text);
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .link-card:hover::after {
            width: 100%;
        }

        .link-card:active {
            transform: translateY(-1px);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 1.1rem;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            text-align: left;
        }

        .link-content i,
        .link-img {
            font-size: 1.2rem;
            width: 2rem;
            flex-shrink: 0;
            color: var(--color-text);
            object-fit: contain;
        }

        .arrow {
            font-size: 0.8rem;
            opacity: 0.4;
            color: var(--color-text);
            transition: var(--transition);
            flex-shrink: 0;
        }

        .link-card:hover .arrow {
            opacity: 1;
            transform: translateX(5px);
        }

        .text-group {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .card-title {
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            line-height: 1.2;
        }

        .card-subtitle {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 400;
            font-size: 0.95rem;
            text-transform: none;
            letter-spacing: 0;
            color: rgba(25, 25, 25, 0.65);
        }

        .premium-wrapper {
            position: relative;
            margin-top: 16px;
        }

        .premium-link {
            background: var(--color-surface-alt);
        }

        .premium-link:hover {
            background: #E2DAC9;
        }

        .premium-tag {
            position: absolute;
            top: -12px;
            left: 24px;
            z-index: 5;
            background: var(--color-text);
            color: var(--color-bg);
            padding: 0.3rem 1rem;
            border-radius: var(--radius-pill);
            font-family: var(--font-sans);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        footer {
            margin-top: 3.5rem;
            padding-top: 2.2rem;
            border-top: 1px solid var(--color-border-soft);
            color: var(--color-text-muted);
            font-size: 0.82rem;
            text-align: center;
        }

        @media (min-width: 900px) {
            footer {
                max-width: 460px;
                margin-left: auto;
                margin-right: auto;
            }
        }

        .location {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--color-text-muted);
            font-weight: 600;
        }

        .fade-in {
            opacity: 0;
        }

        .fade-up {
            opacity: 0;
            transform: translateY(18px);
        }

        @media (max-width: 480px) {
            .cover-banner {
                height: 220px;
            }

            .profile-side {
                margin-top: -80px;
            }

            .image-wrapper {
                width: 150px;
                height: 150px;
                margin-bottom: 34px;
            }

            .links-side {
                gap: 48px;
                margin-top: 48px;
            }

            .link-card {
                padding: 1.4rem 1.4rem;
            }

            .modal-content {
                padding: 1rem;
                margin: auto;
                width: 95%;
            }

            .iframe-container {
                min-height: 480px;
            }

            .iframe-container iframe {
                min-height: 480px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }

            .fade-in,
            .fade-up {
                opacity: 1 !important;
                transform: none !important;
            }
        }

        /* Booking Modal */
        .modal {
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(248, 245, 237, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border-soft);
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            position: relative;
            margin: auto;
            padding: 1.5rem;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.15);
            transform: scale(0.96);
            transition: transform 0.4s var(--ease-premium);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--color-text);
            font-size: 26px;
            font-weight: 400;
            cursor: pointer;
            transition: var(--transition);
        }

        .close-modal:hover {
            color: var(--color-text-muted);
            transform: scale(1.1);
        }

        .iframe-container {
            width: 100%;
            min-height: 550px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .iframe-container iframe {
            min-height: 550px;
        }
    </style>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,400;1,500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="cover-banner fade-in"></div>

            <div class="profile-side">

                    style="width: 100%; border:none; overflow: hidden;" scrolling="no"
                    id="GiVXtcoTuEfrkCoxpF0W_1781538813024"></iframe>
                <script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const preloader = document.getElementById('preloader');
            const progressFill = document.querySelector('.progress-fill');
            const statusText = document.querySelector('.status-text');
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 20;
                if (progress > 100) progress = 100;
                progressFill.style.width = `${progress}%`;
                if (progress === 100) {
                    clearInterval(interval);
                    statusText.textContent = 'Acceso Concedido';
                    setTimeout(() => {
                        preloader.style.transition = 'opacity 0.5s var(--ease-premium)';
                        preloader.style.opacity = '0';
                        preloader.style.pointerEvents = 'none';
                        document.body.style.overflow = 'auto';
                        startLinkhubAnimations();
                        setTimeout(() => {
                            preloader.style.display = 'none';
                        }, 500);
                    }, 500);
                }
            }, 120);
            document.body.style.overflow = 'hidden';

            function startLinkhubAnimations() {
                const fadeIns = document.querySelectorAll('.fade-in');
                const fadeUps = document.querySelectorAll('.fade-up');

                fadeIns.forEach((el) => {
                    el.style.opacity = '1';
                    el.style.transition = 'opacity 900ms ease-out';
                });

                fadeUps.forEach((el, index) => {
                    setTimeout(() => {
                        el.style.opacity = '1';
                        el.style.transform = 'translateY(0)';
                        el.style.transition = 'opacity 700ms cubic-bezier(.22,1,.36,1), transform 700ms cubic-bezier(.22,1,.36,1)';
                    }, 150 + (index * 80));
                });
            }

            const profileImg = document.querySelector('.profile-img');
            if (profileImg && !reduceMotion) {
                document.addEventListener('mousemove', (e) => {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                    profileImg.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                });
                document.addEventListener('mouseleave', () => {
                    profileImg.style.transform = `rotateY(0deg) rotateX(0deg)`;
                    profileImg.style.transition = 'all 0.5s ease';
                });
                document.addEventListener('mouseenter', () => {
                    profileImg.style.transition = 'none';
                });
            }

            // Modal functionality
            const modal = document.getElementById('booking-modal');
            const btn = document.getElementById('booking-btn');
            const closeSpan = document.querySelector('.close-modal');

            if (btn && modal && closeSpan) {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    modal.style.display = 'flex';
                    modal.offsetHeight;
                    modal.classList.add('show');
                    document.body.style.overflow = 'hidden';
                });

                const closeModal = () => {
                    modal.classList.remove('show');
                    document.body.style.overflow = 'auto';
                    setTimeout(() => {
                        if (!modal.classList.contains('show')) {
                            modal.style.display = 'none';
                        }
                    }, 400);
                };

                closeSpan.addEventListener('click', closeModal);

                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        closeModal();
                    }
                });
            }
        });
    </script>

</html>
